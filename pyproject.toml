[project]
name = "product-card-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ai-programmer7", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
